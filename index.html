<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>江山时序 · 中国历史地图时间轴</title>
  <meta name="description" content="拖动时间轴，从秦朝到现代，浏览历代疆域、州郡政区、古今地名沿革与重大历史事件，支持古地名挑战模式与中英双语。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20261009h" />
</head>
<body>
  <div id="atlas-shell">
    <header id="nav-bar">
      <div class="brand-group">
        <h1 id="site-heading">
          <span class="seal-mark" id="txt-seal">江山时序</span>
          <span class="subtitle-mark" id="txt-subtitle">中国历史地图 · 秦 → 今</span>
        </h1>
      </div>
      <div class="control-strip" role="toolbar" aria-label="地图图层与交互模式">
        <label class="layer-chip"><input type="checkbox" id="chk-provinces" checked /><span id="lbl-provinces">现代省界</span></label>
        <label class="layer-chip"><input type="checkbox" id="chk-prov-names" /><span id="lbl-prov-names">现代省名</span></label>
        <label class="layer-chip"><input type="checkbox" id="chk-polities" checked /><span id="lbl-polities">历史疆域</span></label>
        <label class="layer-chip"><input type="checkbox" id="chk-prefectures" checked /><span id="lbl-prefectures">州道政区</span></label>
        <label class="layer-chip"><input type="checkbox" id="chk-settlements" checked /><span id="lbl-settlements">古地名</span></label>
        <label class="layer-chip"><input type="checkbox" id="chk-corridors" checked /><span id="lbl-corridors">长城 · 运河 · 丝路</span></label>
        <label class="layer-chip"><input type="checkbox" id="chk-milestones" checked /><span id="lbl-milestones">事件</span></label>
        <button id="act-reset-camera" class="action-btn subtle" title="复位视图">
          <svg class="btn-svg" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/></svg>
          <span id="lbl-reset-camera">复位视图</span>
        </button>
        <button id="act-genealogy" class="action-btn subtle" title="点击地图任意位置，查看该地从秦到清的政区与古城沿革">
          <svg class="btn-svg" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 1.5a4.3 4.3 0 0 0-4.3 4.3c0 3.1 4.3 8.4 4.3 8.4s4.3-5.3 4.3-8.4A4.3 4.3 0 0 0 8 1.5zm0 5.9a1.6 1.6 0 1 1 0-3.2 1.6 1.6 0 0 1 0 3.2z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <span id="lbl-genealogy">点地溯源</span>
        </button>
        <button id="act-challenge" class="action-btn accent">
          <svg class="btn-svg" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2.2" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span id="lbl-challenge">开始挑战</span>
        </button>
        <div class="music-pill-group" role="group" aria-label="古琴雅乐">
          <button id="act-music" class="action-btn subtle music-btn" title="播放 / 暂停古琴雅乐">
            <svg class="btn-svg music-svg" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <path d="M6 12.2V3.5l7-1.5v8.7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="4.3" cy="12.2" r="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <circle cx="11.3" cy="10.7" r="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/>
            </svg>
            <span id="lbl-music">雅乐</span>
          </button>
          <button id="act-music-next" class="action-btn subtle music-next-btn is-hidden" title="切换下一首古琴曲" aria-label="切换下一首古琴曲">
            <svg class="btn-svg" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
              <polygon points="3.5,3.2 10.2,8 3.5,12.8" fill="currentColor"/>
              <line x1="12.2" y1="3.2" x2="12.2" y2="12.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <button id="act-locale" class="action-btn subtle locale-switch" title="Switch language / 切换中英文">
          <svg class="btn-svg" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.3"/><ellipse cx="8" cy="8" rx="2.8" ry="6.2" fill="none" stroke="currentColor" stroke-width="1.2"/><line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.2"/></svg>
          <span id="lbl-locale">EN</span>
        </button>
      </div>
    </header>

    <main id="workspace-body">
      <div id="viewport-frame">
        <svg id="atlas-svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="中国历史地图">
          <defs>
            <pattern id="diag-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(35)">
              <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(43,38,34,0.28)" stroke-width="2" />
            </pattern>
            <filter id="label-halo" x="-20%" y="-20%" width="140%" height="140%">
              <feMorphology operator="dilate" radius="1.4" in="SourceAlpha" result="dilated" />
              <feFlood flood-color="#f6f1e6" flood-opacity="0.92" result="bg" />
              <feComposite in="bg" in2="dilated" operator="in" result="outline" />
              <feMerge>
                <feMergeNode in="outline" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <rect id="ocean-bg" x="-2000" y="-2000" width="6000" height="6000" />
          <g id="camera-rig">
            <g id="grp-neighbors"></g>
            <g id="grp-provinces"></g>
            <g id="grp-polities"></g>
            <g id="grp-prefectures"></g>
            <g id="grp-corridors"></g>
            <g id="grp-prov-names" class="is-hidden"></g>
            <g id="grp-settlements"></g>
            <g id="grp-milestones"></g>
            <g id="grp-challenge"></g>
            <g id="grp-genealogy"></g>
          </g>
        </svg>

        <div id="map-search-box" role="search" aria-label="快速检索古今地名、州府、年号与事件">
          <div class="search-input-wrap">
            <svg class="search-ico" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <circle cx="7" cy="7" r="4.8" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <path d="M10.6 10.6L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input id="inp-map-search" type="search" autocomplete="off" placeholder="搜古今地名 / 州府 / 年号 / 事件 ( / )" aria-label="搜古今地名、州府、年号或事件" />
          </div>
          <ul id="map-search-results" class="search-results-list is-hidden" role="listbox"></ul>
        </div>

        <div id="map-key" aria-live="polite"></div>

        <div id="challenge-card" class="is-hidden" role="region" aria-label="古地名挑战">
          <div class="challenge-top">
            <div class="mode-pills" role="tablist">
              <button id="tab-locate" class="mode-pill is-active" role="tab">地图寻址</button>
              <button id="tab-match" class="mode-pill" role="tab">古今对号</button>
            </div>
            <span id="challenge-step" class="pill-badge">第 1 / 10 题</span>
            <span id="challenge-points" class="score-readout">得分 0</span>
            <button id="act-close-challenge" class="icon-close" title="退出挑战" aria-label="退出挑战">
              <svg class="ico-svg" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div id="challenge-question" class="challenge-prompt"></div>
          <div id="challenge-options" class="options-grid is-hidden"></div>
          <div id="challenge-result" class="challenge-feedback is-hidden">
            <span id="challenge-verdict"></span>
            <button id="act-next-round" class="action-btn accent sm"></button>
          </div>
        </div>

        <div id="genealogy-card" class="is-hidden" role="dialog" aria-label="古今地名沿革">
          <div class="genealogy-header">
            <div>
              <div class="genealogy-tag" id="txt-genealogy-kicker">点地溯源 · 古今政区沿革</div>
              <div id="genealogy-heading" class="genealogy-title"></div>
            </div>
            <button id="act-close-genealogy" class="icon-close" title="关闭" aria-label="关闭">
              <svg class="ico-svg" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div id="genealogy-sub" class="genealogy-sub"></div>
          <ol id="genealogy-timeline" class="genealogy-list"></ol>
        </div>

        <div id="milestone-balloon" class="is-hidden" role="dialog" aria-live="polite"></div>

        <div id="hover-tip" class="is-hidden" role="tooltip"></div>

        <div id="gesture-guide">滚轮缩放 · 拖拽平移 · ← → 调整年份 · 空格播放 · Esc 关闭弹窗</div>
      </div>

      <aside id="chronicle-pane" aria-label="历史时期详情">
        <div class="dynasty-banner">
          <div class="dynasty-title-row">
            <h2 id="dynasty-title">秦</h2>
            <span id="dynasty-span" class="span-label">前221 — 前202</span>
          </div>
          <div class="seat-row">
            <span class="seat-tag" id="txt-seat-label">都城</span>
            <span id="dynasty-seat">—</span>
          </div>
        </div>

        <p id="dynasty-summary" class="dynasty-desc"></p>

        <div class="milestone-section">
          <h3 id="txt-milestones-heading">重大事件</h3>
          <ul id="milestone-list"></ul>
        </div>

        <div class="disclaimer-box" id="txt-disclaimer">
          疆域轮廓与州郡政区为示意性近似，用于直观对比各时期大致范围，非精确历史测绘边界。
        </div>
      </aside>
    </main>

    <footer id="scrubber-dock" aria-label="历史年份时间轴">
      <button id="act-autoplay" class="round-btn" title="自动播放 / 暂停" aria-label="播放">
        <svg class="ico-svg" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><polygon points="4.5,2.8 13.2,8 4.5,13.2" fill="currentColor"/></svg>
      </button>

      <div id="scrubber-rail-wrap">
        <div id="scrubber-Bubble" aria-live="polite">
          <span id="bubble-text">公元前214年 · 秦始皇三十三年</span>
        </div>
        <div id="scrubber-track" role="slider" tabindex="0" aria-valuemin="-221" aria-valuemax="2026" aria-valuenow="-214" aria-label="年份滑块">
          <div id="dynasty-bands"></div>
          <div id="scrubber-handle"></div>
        </div>
        <div id="scrubber-ticks"></div>
      </div>

      <div class="year-stepper">
        <input id="inp-year" type="number" min="-221" max="2026" step="1" value="-214" aria-label="输入年份（负数为公元前）" />
        <span class="unit-label" id="txt-year-suffix">年</span>
      </div>
    </footer>
  </div>

  <script src="js/china_geo_data.js?v=20261009h"></script>
  <script src="js/atlas_snapshots.js?v=20261009h"></script>
  <script src="js/map_data.js?v=20261009h"></script>
  <script src="js/i18n_dict.js?v=20261009h"></script>
  <script src="js/app.js?v=20261009h"></script>
</body>
</html>
